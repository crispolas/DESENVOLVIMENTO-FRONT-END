<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas Acadêmicas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Gerenciador de Tarefas Acadêmicas</h1>
  </header>
  <main>
  <div id="status" role="status" aria-live="polite"></div>
  <section aria-labelledby="busca-filtros-heading">
  <h2 id="busca-filtros-heading">Busca e filtros</h2>

  <form>
    <div>
      <label for="busca-titulo">Buscar por título da tarefa</label>
      <input type="search" id="busca-titulo" name="busca-titulo">
    </div>

    <fieldset>
      <legend>Filtrar por status</legend>
      <div>
        <input type="radio" id="status-todos" name="status" value="todos" checked>
        <label for="status-todos">Todos</label>
      </div>
      <div>
        <input type="radio" id="status-a-fazer" name="status" value="a-fazer">
        <label for="status-a-fazer">A fazer</label>
      </div>
      <div>
        <input type="radio" id="status-em-andamento" name="status" value="em-andamento">
        <label for="status-em-andamento">Em andamento</label>
      </div>
      <div>
        <input type="radio" id="status-em-revisao" name="status" value="em-revisao">
        <label for="status-em-revisao">Em revisão</label>
      </div>
      <div>
        <input type="radio" id="status-concluida" name="status" value="concluida">
        <label for="status-concluida">Concluída</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Filtrar por prioridade</legend>
      <div>
        <input type="radio" id="prioridade-todas" name="prioridade" value="todas" checked>
        <label for="prioridade-todas">Todas</label>
      </div>
      <div>
        <input type="radio" id="prioridade-baixa" name="prioridade" value="baixa">
        <label for="prioridade-baixa">Baixa</label>
      </div>
      <div>
        <input type="radio" id="prioridade-media" name="prioridade" value="media">
        <label for="prioridade-media">Média</label>
      </div>
      <div>
        <input type="radio" id="prioridade-alta" name="prioridade" value="alta">
        <label for="prioridade-alta">Alta</label>
      </div>
    </fieldset>

    <div>
      <label for="ordenacao">Ordenar por prazo</label>
      <select id="ordenacao" name="ordenacao">
        <option value="prazo-asc">Prazo mais próximo primeiro</option>
        <option value="prazo-desc">Prazo mais distante primeiro</option>
      </select>
    </div>

    <div>
      <button type="button" id="btn-limpar-filtros">Limpar filtros</button>
    </div>

  </form>

</section>
  <section aria-labelledby="quadro-heading" data-quadro>
      <h2 id="quadro-heading">Quadro de tarefas</h2>

      <section aria-labelledby="coluna-a-fazer-heading">
        <h3 id="coluna-a-fazer-heading">A fazer</h3>
        <ul data-lista-status="a-fazer"></ul>
      </section>

      <section aria-labelledby="coluna-em-andamento-heading">
        <h3 id="coluna-em-andamento-heading">Em andamento</h3>
        <ul data-lista-status="em-andamento"></ul>
      </section>

      <section aria-labelledby="coluna-em-revisao-heading">
        <h3 id="coluna-em-revisao-heading">Em revisão</h3>
        <ul data-lista-status="em-revisao"></ul>
      </section>

      <section aria-labelledby="coluna-concluida-heading">
        <h3 id="coluna-concluida-heading">Concluída</h3>
        <ul data-lista-status="concluida"></ul>
      </section>

    </section>
</main>

  <footer>
    <p>Gabriel — Desenvolvimento Frontend, 2026.2 - Quarta</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
